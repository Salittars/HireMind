name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      # Offline mode: committed sample, TF-IDF retrieval, no API keys, no model download.
      JOBRAG_RAW_DIR: data/sample
      JOBRAG_EMBEDDER: tfidf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Smoke test the CLI on the sample
        run: |
          JOBRAG_DB=/tmp/sample.duckdb python -m jobrag build
          JOBRAG_DB=/tmp/sample.duckdb python -m jobrag ask "Which jobs ask for dbt and Snowflake?"
